<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login - Smart Agriculture</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>

  <body>
    <nav>
      <h2>🌱 Smart Agriculture</h2>

      <div>
        <a href="/">Home</a>
        <a href="/disease">Disease Detection</a>
        <a href="/yield">Yield Prediction</a>
        <a href="/login">Login</a>
      </div>
    </nav>

    <div class="container">
      <div class="auth-card">
        <h1>🔐 Login</h1>

        <p>Login to your Smart Agriculture account.</p>

        {% if message %}

        <div class="error-message">{{ message }}</div>

        {% endif %}

        <form method="POST">
          <label for="email"> Email </label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
          />

          <label for="password"> Password </label>

          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            required
          />

          <button type="submit">🔐 Login</button>
        </form>

        <p class="auth-link">
          Don't have an account?

          <a href="/register"> Create account </a>
        </p>
      </div>
    </div>
  </body>
</html>
