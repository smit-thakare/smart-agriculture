<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Smart Agriculture</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<nav>
    <h2>🌱 Smart Agriculture</h2>

    <div>
        <a href="/">Home</a>
        <a href="/disease">Disease Detection</a>
        <a href="/yield">Yield Prediction</a>
        <a href="/login">Login</a>
    </div>
</nav>


<div class="container">

    <div class="auth-card">

        <h1>🌱 Create Account</h1>

        <p>Register to use Smart Agriculture AI features.</p>


        {% if message %}

        <div class="error-message">
            {{ message }}
        </div>

        {% endif %}


        <form method="POST">

            <label for="name">
                Full Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your name"
                required
            >


            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Create a password"
                required
            >


            <button type="submit">
                📝 Create Account
            </button>

        </form>


        <p class="auth-link">
            Already have an account?

            <a href="/login">
                Login here
            </a>
        </p>

    </div>

</div>

</body>
</html>
